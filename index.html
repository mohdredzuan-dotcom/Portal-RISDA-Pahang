<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Pentadbiran RISDA Pahang</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel untuk kompilasi JSX dalam pelayar -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased selection:bg-yellow-200 selection:text-blue-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- LOGO GOOGLE DRIVE RESMI RISDA PAHANG ---
    const LOGO_GOLD_DRIVE_ID = '1BGSfgfm7VUIn-JhDbtJCd9XecMntMt8I';
    const LOGO_SECOND_DRIVE_ID = '12QAe7WTrkpBDVW2kc48YnB5XjvOH9H6z';

    const LOGO_GOLD_URL = `https://lh3.googleusercontent.com/d/${LOGO_GOLD_DRIVE_ID}`;
    const LOGO_SECOND_URL = `https://lh3.googleusercontent.com/d/${LOGO_SECOND_DRIVE_ID}`;

    // Komponen Logo dengan Fallback SVG
    const RisdaDriveLogo = ({ className = "h-12 w-auto", showGlow = true, isSecond = false }) => {
      const [hasError, setHasError] = useState(false);
      const targetUrl = isSecond ? LOGO_SECOND_URL : LOGO_GOLD_URL;

      if (hasError) {
        return <RisdaGoldLogo className={className} showGlow={showGlow} />;
      }

      return (
        <img 
          src={targetUrl} 
          alt={isSecond ? "Logo Sekunder RISDA" : "Logo Rasmi RISDA Emas"} 
          className={`${className} object-contain ${showGlow ? 'filter drop-shadow-[0_4px_10px_rgba(234,179,8,0.45)]' : ''} transition-transform duration-300`}
          onError={() => setHasError(true)}
          loading="eager"
        />
      );
    };

    // Fallback Logo SVG Vektor Tulen Emas
    const RisdaGoldLogo = ({ className = "h-12 w-auto", showGlow = true }) => (
      <svg 
        viewBox="0 0 500 500" 
        className={`${className} ${showGlow ? 'filter drop-shadow-[0_4px_8px_rgba(234,179,8,0.5)]' : ''}`}
        fill="none" 
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor="#FFF176" />
            <stop offset="30%" stopColor="#EAB308" />
            <stop offset="70%" stopColor="#CA8A04" />
            <stop offset="100%" stopColor="#A16207" />
          </linearGradient>
          <path id="curveBottom" d="M 40 250 A 215 215 0 0 0 460 250" fill="none" />
        </defs>
        <circle cx="250" cy="250" r="236" stroke="url(#goldGrad)" strokeWidth="6" />
        <text fill="url(#goldGrad)" fontSize="18.5" fontWeight="900" letterSpacing="5" fontFamily="Arial, sans-serif">
          <textPath href="#curveBottom" startOffset="50%" textAnchor="middle">
            PIHAK BERKUASA KEMAJUAN PEKEBUN KECIL PERUSAHAAN GETAH
          </textPath>
        </text>
        <g fill="url(#goldGrad)">
          <path d="M 250 8 C 220 50 205 105 250 160 C 295 105 280 50 250 8 Z" />
          <path d="M 148 100 C 145 130 185 180 238 188 C 230 145 185 105 148 100 Z" />
          <path d="M 352 100 C 355 130 315 180 262 188 C 270 145 315 105 352 100 Z" />
        </g>
        <path 
          d="M 68 185 C 92 375 408 375 432 185 C 375 228 305 246 250 246 C 195 246 125 228 68 185 Z" 
          fill="url(#goldGrad)" 
        />
        <text x="250" y="375" textAnchor="middle" fill="#FFFFFF" fontSize="48" fontWeight="bold" fontFamily="sans-serif">
          RISDA
        </text>
      </svg>
    );

    // Pembantu Ikon Lucide untuk Pelayar Web
    const Icon = ({ name, className = "w-5 h-5", ...props }) => {
      const containerRef = React.useRef(null);
      useEffect(() => {
        if (containerRef.current && window.lucide) {
          window.lucide.createIcons({
            root: containerRef.current
          });
        }
      }, [name]);

      return (
        <span ref={containerRef} className="inline-flex items-center justify-center">
          <i data-lucide={name} className={className} {...props}></i>
        </span>
      );
    };

    // Parser CSV Google Sheets
    const parseCSV = (str) => {
      const arr = [];
      let quote = false;
      let row = 0, col = 0;
      for (let c = 0; c < str.length; c++) {
        let cc = str[c], nc = str[c + 1];
        arr[row] = arr[row] || [];
        arr[row][col] = arr[row][col] || '';
        if (cc === '"' && quote && nc === '"') { arr[row][col] += cc; ++c; continue; }
        if (cc === '"') { quote = !quote; continue; }
        if (cc === ',' && !quote) { ++col; continue; }
        if (cc === '\r' && nc === '\n' && !quote) { ++row; col = 0; ++c; continue; }
        if (cc === '\n' && !quote) { ++row; col = 0; continue; }
        if (cc === '\r' && !quote) { ++row; col = 0; continue; }
        arr[row][col] += cc;
      }
      return arr;
    };

       // --- KOMPONEN DASHBOARD SUMBER MANUSIA (HR) LENGKAP DENGAN VISUALISASI ---
    const DashboardHR = () => {
      const [searchQuery, setSearchQuery] = useState('');
      const [filterPtj, setFilterPtj] = useState('Semua');
      const [filterSkim, setFilterSkim] = useState('Semua');
      const [selectedStaff, setSelectedStaff] = useState(null);
      const [showRetiringOnly, setShowRetiringOnly] = useState(false);
      const [showAnalytics, setShowAnalytics] = useState(true);

      const [staffData, setStaffData] = useState([]);
      const [isLoadingCSV, setIsLoadingCSV] = useState(true);

      useEffect(() => {
        const fetchGoogleSheetsData = async () => {
          try {
            const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRBHXzXmWa6an5B7a89MsZp9BvZXUW5rt-cBIyQmgneyhRNIUbXA9hqu9Bc1tl5cLfNDSSckUGEo8wL/pub?gid=0&single=true&output=csv";
            const response = await fetch(csvUrl);
            const csvText = await response.text();
            const parsedData = parseCSV(csvText);

            if (parsedData.length > 1) {
              const headers = parsedData[0].map(h => h.trim().toUpperCase());
              
              const mappedData = parsedData.slice(1).map((row, index) => {
                const getVal = (keywords) => {
                  const keys = Array.isArray(keywords) ? keywords : [keywords];
                  for (let key of keys) {
                    const idx = headers.findIndex(h => h.includes(key));
                    if (idx !== -1 && row[idx]) return row[idx].trim();
                  }
                  return '-';
                };

                const nama = getVal('NAMA');
                const noKp = getVal(['NO KP', 'KAD PENGENALAN', 'NO. KP', 'NO_KP', 'IC']).replace(/[^0-9]/g, '');
                const rawGambar = getVal(['URL GAMBAR', 'GAMBAR', 'FOTO', 'PHOTO']);

                let tarikhLahir = getVal(['TARIKH LAHIR', 'TARIKH_LAHIR', 'DOB']);
                if ((!tarikhLahir || tarikhLahir === '-') && noKp && noKp.length >= 6) {
                  const yy = noKp.substring(0, 2);
                  const mm = noKp.substring(2, 4);
                  const dd = noKp.substring(4, 6);
                  const yearPrefix = parseInt(yy, 10) > 30 ? "19" : "20";
                  tarikhLahir = `${dd}/${mm}/${yearPrefix}${yy}`;
                }

                const resolveDriveUrl = (url) => {
                  if (!url || url === '-') return '';
                  const fileIdMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
                  if (fileIdMatch && fileIdMatch[1]) return `https://lh3.googleusercontent.com/d/${fileIdMatch[1]}`;
                  const idParamMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                  if (idParamMatch && idParamMatch[1]) return `https://lh3.googleusercontent.com/d/${idParamMatch[1]}`;
                  return url;
                };

                const directImageUrl = resolveDriveUrl(rawGambar);
                const defaultAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(nama)}&background=1e3a8a&color=facc15&size=128&bold=true`;
                const finalGambar = directImageUrl || (noKp ? `gambar_staf/${noKp}.jpg` : defaultAvatar);

                const noPekerja = getVal('NO PEKERJA');
                let rawSkim = getVal('SKIM');

                if (
                  noPekerja.includes('85185') || 
                  noPekerja.includes('76730') || 
                  nama.toUpperCase().includes('SYUHAIDA BINTI SHUKOR') || 
                  nama.toUpperCase().includes('WAN KAMARIAH BINTI WAN MUHAMMAD')
                ) {
                  rawSkim = 'G12';
                }

                const rawJantina = getVal('JANTINA').trim().toUpperCase();
                let jantinaPenuh = rawJantina;
                if (rawJantina.startsWith('L')) jantinaPenuh = 'Lelaki';
                else if (rawJantina.startsWith('P')) jantinaPenuh = 'Perempuan';

                const tarikhLantikanStr = getVal(['LANTIKAN PERTAMA', 'TARIKHLANTIKAN', 'TARIKH LANTIKAN']);

                const kiraTempohPerkhidmatan = (tarikhStr) => {
                  if (!tarikhStr || tarikhStr === '-') return '-';
                  const parts = tarikhStr.split(/[\/\-.]/);
                  let lantikanDate = null;

                  if (parts.length === 3) {
                    if (parts[2].length === 4) lantikanDate = new Date(parseInt(parts[2], 10), parseInt(parts[1], 10) - 1, parseInt(parts[0], 10));
                    else if (parts[0].length === 4) lantikanDate = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
                  }

                  if (!lantikanDate || isNaN(lantikanDate.getTime())) {
                    const rawFallback = getVal('TEMPOH PERKHIDMATAN');
                    return rawFallback !== '-' ? `${rawFallback} Tahun` : '-';
                  }

                  const today = new Date();
                  let years = today.getFullYear() - lantikanDate.getFullYear();
                  let months = today.getMonth() - lantikanDate.getMonth();
                  let days = today.getDate() - lantikanDate.getDate();

                  if (days < 0) months--;
                  if (months < 0) { years--; months += 12; }

                  if (years < 0) return '0 Tahun';
                  if (months === 0) return `${years} Tahun`;
                  return `${years} Tahun ${months} Bulan`;
                };

                return {
                  id: index + 1,
                  nama: nama,
                  no_kp: noKp,
                  no_pekerja: noPekerja,
                  emel: getVal(['EMEL', 'EMAIL']),
                  skim: rawSkim,
                  gred: getVal('GRED'),
                  ptj: getVal(['TANGGUNGJAWAB', 'TANGUNGGJAWAB', 'PTJ', 'PUSAT']),
                  negeri: getVal('NEGERI'),
                  jantina: jantinaPenuh,
                  bahagian: getVal(['BAHAGIAN', 'UNIT']),
                  tarikh_lantikan: tarikhLantikanStr,
                  tarikh_pt_sekarang: getVal(['DI TEMPATKAN', 'DITEMPATKAN', 'PT SEKARANG']),
                  tarikh_lahir: tarikhLahir,
                  umur_bersara: getVal('UMUR BERSARA'),
                  tarikh_bersara: getVal('TARIKH BERSARA'),
                  tempoh_perkhidmatan: kiraTempohPerkhidmatan(tarikhLantikanStr),
                  tarikh_pengesahan: getVal('PENGESAHAN JAWATAN'),
                  gambar: finalGambar
                };
              }).filter(s => s.nama !== '-' && s.nama !== '');
              
              setStaffData(mappedData);
            }
            setIsLoadingCSV(false);
          } catch (error) {
            console.error("Gagal muat turun CSV:", error);
            setIsLoadingCSV(false);
          }
        };

        fetchGoogleSheetsData();
      }, []);

      const handleResetFilters = () => {
        setSearchQuery('');
        setFilterPtj('Semua');
        setFilterSkim('Semua');
        setShowRetiringOnly(false);
      };

      const isFiltered = searchQuery !== '' || filterPtj !== 'Semua' || filterSkim !== 'Semua' || showRetiringOnly;

      const filteredStaff = staffData.filter(s => {
        const matchName = s.nama.toLowerCase().includes(searchQuery.toLowerCase()) || s.no_pekerja.includes(searchQuery);
        const matchPtj = filterPtj === 'Semua' ? true : s.ptj === filterPtj;
        const matchSkim = filterSkim === 'Semua' ? true : s.skim.replace(/[0-9]/g, '').trim().toUpperCase() === filterSkim; 
        const matchRetiring = showRetiringOnly ? s.tarikh_bersara.includes('2027') : true;
        return matchName && matchPtj && matchSkim && matchRetiring;
      }).sort((a, b) => {
        const ptjA = a.ptj || '';
        const ptjB = b.ptj || '';
        const isPrnA = ptjA.toUpperCase().includes('PRN - PAHANG');
        const isPrnB = ptjB.toUpperCase().includes('PRN - PAHANG');
        
        if (isPrnA && !isPrnB) return -1;
        if (!isPrnA && isPrnB) return 1;
        if (ptjA < ptjB) return -1;
        if (ptjA > ptjB) return 1;

        const getGradeNum = (str) => {
          const match = (str || '').match(/\d+/);
          return match ? parseInt(match[0], 10) : 0;
        };
        const gradeA = getGradeNum(a.skim);
        const gradeB = getGradeNum(b.skim);
        if (gradeA !== gradeB) return gradeB - gradeA;

        return (a.nama || '').localeCompare(b.nama || '');
      });

      const rawPtjList = [...new Set(staffData.map(s => s.ptj).filter(p => p && p !== '-'))].sort();
      const prnPtjMatch = rawPtjList.find(p => p.toUpperCase().includes('PRN - PAHANG'));
      const otherPtjList = rawPtjList.filter(p => p !== prnPtjMatch);
      const uniquePtj = ['Semua'];
      if (prnPtjMatch) uniquePtj.push(prnPtjMatch);
      uniquePtj.push(...otherPtjList);

      const prioritySkims = ['N', 'G', 'W'];
      const bottomSkims = ['J', 'H'];
      const allDetectedSkims = [...new Set(staffData.map(s => s.skim.replace(/[0-9]/g, '').trim().toUpperCase()).filter(s => s && s !== '-'))];
      const presentPrioritySkims = prioritySkims.filter(s => allDetectedSkims.includes(s));
      const middleSkims = allDetectedSkims.filter(s => !prioritySkims.includes(s) && !bottomSkims.includes(s)).sort();
      const presentBottomSkims = bottomSkims.filter(s => allDetectedSkims.includes(s));
      const uniqueSkim = ['Semua', ...presentPrioritySkims, ...middleSkims, ...presentBottomSkims];

      const totalStaff = filteredStaff.length;
      const maleStaff = filteredStaff.filter(s => s.jantina.toUpperCase().startsWith('L')).length;
      const femaleStaff = filteredStaff.filter(s => s.jantina.toUpperCase().startsWith('P')).length;
      const retiringSoon = filteredStaff.filter(s => s.tarikh_bersara.includes('2027')).length;
      const totalPtjCount = new Set(filteredStaff.map(s => s.ptj).filter(p => p && p !== '-')).size;

      // Pengiraan Taburan Statistik
      const ptjDistribution = useMemo(() => {
        const counts = {};
        filteredStaff.forEach(s => {
          const ptjName = s.ptj && s.ptj !== '-' ? s.ptj.replace(/PEJABAT RISDA DAERAH|PEJABAT PRD -|PEJABAT/gi, '').trim() : 'Lain-lain';
          counts[ptjName] = (counts[ptjName] || 0) + 1;
        });
        return Object.entries(counts).map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count);
      }, [filteredStaff]);

      const maxPtjCount = ptjDistribution.length > 0 ? ptjDistribution[0].count : 1;

      const skimGroupDistribution = useMemo(() => {
        const counts = {};
        filteredStaff.forEach(s => {
          const raw = (s.skim || '').trim();
          const grp = raw.replace(/[0-9]/g, '').trim().toUpperCase() || 'Lain-lain';
          if (grp && grp !== '-') counts[grp] = (counts[grp] || 0) + 1;
        });
        return Object.entries(counts).map(([group, count]) => ({ 
          group, 
          count, 
          percentage: totalStaff > 0 ? ((count / totalStaff) * 100).toFixed(1) : 0 
        })).sort((a, b) => b.count - a.count);
      }, [filteredStaff, totalStaff]);

      const ageDistribution = useMemo(() => {
        const cohorts = { 'Bawah 30 Thn': 0, '31 - 40 Thn': 0, '41 - 50 Thn': 0, '51 Thn Ke Atas': 0 };
        const currentYear = new Date().getFullYear();

        filteredStaff.forEach(s => {
          let year = null;
          if (s.tarikh_lahir && s.tarikh_lahir !== '-') {
            const parts = s.tarikh_lahir.split(/[\/\-.]/);
            if (parts.length === 3) {
              const yr = parseInt(parts[2], 10);
              if (yr > 1900 && yr <= currentYear) year = yr;
            }
          }
          if (!year && s.no_kp && s.no_kp.length >= 2) {
            const twoDigit = parseInt(s.no_kp.substring(0, 2), 10);
            year = twoDigit > 30 ? 1900 + twoDigit : 2000 + twoDigit;
          }

          if (year) {
            const age = currentYear - year;
            if (age < 30) cohorts['Bawah 30 Thn']++;
            else if (age <= 40) cohorts['31 - 40 Thn']++;
            else if (age <= 50) cohorts['41 - 50 Thn']++;
            else cohorts['51 Thn Ke Atas']++;
          }
        });
        return cohorts;
      }, [filteredStaff]);

      return (
        <div className="bg-transparent mb-12">
          <div className="mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <h2 className="text-2xl font-black text-blue-900">Dashboard Profiling Kakitangan</h2>
              <p className="text-gray-600 text-sm">Analisis dan pengurusan maklumat tenaga kerja RISDA Pahang (Data Langsung Google Sheets).</p>
            </div>
            <button
              onClick={() => setShowAnalytics(!showAnalytics)}
              className="flex items-center px-4 py-2 bg-blue-100 hover:bg-blue-200 text-blue-900 text-sm font-semibold rounded-lg transition-colors shadow-sm"
            >
              <IconBarChart2 className="w-4 h-4 mr-2" />
              {showAnalytics ? 'Sembunyikan Analisis Visual' : 'Papar Analisis Visual'}
              {showAnalytics ? <IconChevronUp className="w-4 h-4 ml-1.5" /> : <IconChevronDown className="w-4 h-4 ml-1.5" />}
            </button>
          </div>

          {isLoadingCSV ? (
            <div className="flex flex-col items-center justify-center p-12 bg-white rounded-xl shadow-sm border border-gray-200">
               <div className="inline-block animate-spin rounded-full h-10 w-10 border-b-4 border-blue-900 mb-4"></div>
               <p className="text-gray-600 font-medium">Sedang memuat turun data kakitangan dari Google Sheets...</p>
            </div>
          ) : (
            <>
              {/* Kad Ringkasan Eksekutif */}
              <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                <div className="bg-white p-5 rounded-xl border-l-4 border-blue-600 shadow-sm flex items-center justify-between hover:shadow-md transition-all">
                  <div>
                    <p className="text-sm font-medium text-gray-500">Jumlah Kakitangan</p>
                    <h3 className="text-3xl font-black text-gray-900">{totalStaff}</h3>
                  </div>
                  <div className="p-3 bg-blue-50 text-blue-700 rounded-lg"><IconUsers className="w-6 h-6" /></div>
                </div>
                <div className="bg-white p-5 rounded-xl border-l-4 border-indigo-500 shadow-sm flex items-center justify-between hover:shadow-md transition-all">
                  <div>
                    <p className="text-sm font-medium text-gray-500">Lelaki / Perempuan</p>
                    <h3 className="text-xl font-black text-gray-900">{maleStaff} <span className="text-gray-400 text-sm font-normal">/</span> {femaleStaff}</h3>
                    <p className="text-xs text-gray-400 mt-1">
                      {totalStaff > 0 ? ((maleStaff/totalStaff)*100).toFixed(0) : 0}% L / {totalStaff > 0 ? ((femaleStaff/totalStaff)*100).toFixed(0) : 0}% P
                    </p>
                  </div>
                  <div className="p-3 bg-indigo-50 text-indigo-700 rounded-lg"><IconUser className="w-6 h-6" /></div>
                </div>
                <div 
                  onClick={() => setShowRetiringOnly(!showRetiringOnly)}
                  className={`p-5 rounded-xl border-l-4 border-yellow-500 shadow-sm flex items-center justify-between hover:shadow-md transition-all cursor-pointer ${showRetiringOnly ? 'bg-yellow-50 ring-2 ring-yellow-400' : 'bg-white'}`}
                  title="Klik untuk tapis senarai staf bakal bersara"
                >
                  <div>
                    <p className={`text-sm font-medium ${showRetiringOnly ? 'text-yellow-700' : 'text-gray-500'}`}>Bakal Bersara (1 Tahun)</p>
                    <h3 className="text-3xl font-black text-gray-900">
                      {retiringSoon}
                      {showRetiringOnly && <span className="text-xs text-yellow-600 ml-2 font-normal whitespace-nowrap">(Ditapis)</span>}
                    </h3>
                    <p className="text-xs text-yellow-600 mt-1">Klik untuk lihat nama</p>
                  </div>
                  <div className={`p-3 rounded-lg ${showRetiringOnly ? 'bg-yellow-200 text-yellow-800' : 'bg-yellow-50 text-yellow-700'}`}><IconAlertTriangle className="w-6 h-6" /></div>
                </div>
                <div className="bg-white p-5 rounded-xl border-l-4 border-green-500 shadow-sm flex items-center justify-between hover:shadow-md transition-all">
                  <div>
                    <p className="text-sm font-medium text-gray-500">Pusat Tanggungjawab</p>
                    <h3 className="text-3xl font-black text-gray-900">{totalPtjCount} <span className="text-lg text-gray-400 font-normal">PTJ</span></h3>
                    <p className="text-xs text-gray-400 mt-1">Aktif di seluruh Pahang</p>
                  </div>
                  <div className="p-3 bg-green-50 text-green-700 rounded-lg"><IconBuilding className="w-6 h-6" /></div>
                </div>
              </div>

              {/* Seksyen Visualisasi Dinamik */}
              {showAnalytics && (
                <div className="space-y-6 mb-8">
                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    {/* Visual 1: Taburan PTJ */}
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200 lg:col-span-2">
                      <div className="flex items-center justify-between mb-6 border-b pb-3">
                        <div className="flex items-center space-x-3">
                          <div className="p-2.5 bg-gradient-to-br from-blue-800 to-blue-600 text-white rounded-lg shadow-sm">
                            <IconBarChart2 className="w-5 h-5" />
                          </div>
                          <div>
                            <h3 className="font-black text-gray-900 text-lg">Kepadatan Tenaga Kerja Mengikut PTJ</h3>
                            <p className="text-xs text-gray-500 font-medium">Kedudukan 8 pusat tanggungjawab tertinggi</p>
                          </div>
                        </div>
                        <span className="text-xs font-bold px-3 py-1.5 bg-blue-50 text-blue-800 rounded-full border border-blue-100">
                          {ptjDistribution.length} PTJ Aktif
                        </span>
                      </div>

                      <div className="space-y-5">
                        {ptjDistribution.slice(0, 8).map((item, idx) => {

                    <h3 className="text-xl font-bold text-blue-900 border-b-2 border-yellow-400 pb-2 inline-block">
                      Senarai Pejabat Daerah (8 PT)
                    </h3>
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                      {daerahList.map((d, i) => (
                        <div key={i} className="bg-white border border-gray-200 rounded-xl p-4 flex gap-4 shadow-sm">
                          <div className="w-1/3 bg-gray-100 rounded-lg overflow-hidden shrink-0 border border-gray-200 hidden sm:block">
                            <iframe 
                              width="100%" height="100%" frameBorder="0" 
                              src={`https://maps.google.com/maps?q=${encodeURIComponent(d.nama)}&t=&z=14&ie=UTF8&iwloc=&output=embed`}
                              className="w-full h-full min-h-[110px]"
                            ></iframe>
                          </div>
                          <div className="w-full sm:w-2/3 flex flex-col justify-center text-xs">
                            <h4 className="font-bold text-gray-900 text-sm mb-1">{d.nama}</h4>
                            <p className="text-gray-600 mb-2">{d.alamat}</p>
                            <span className="text-blue-800 font-semibold bg-blue-50 px-2 py-1 rounded self-start">
                              Tel: {d.tel}
                            </span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {(lokasiTab === 'stesen' || lokasiTab === 'mini') && (
                  <div className="space-y-4">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                      <h3 className="text-xl font-bold text-blue-900 border-b-2 border-yellow-400 pb-2 inline-block">
                        {lokasiTab === 'mini' ? 'Senarai Pejabat RISDA Mini Stesen (3 PRMS)' : 'Senarai Pejabat RISDA Stesen (20 PRS)'}
                      </h3>
                      <div className="flex items-center space-x-2 bg-white px-3 py-1.5 rounded-lg border border-gray-200 text-xs">
                        <Icon name="filter" className="w-3.5 h-3.5 text-blue-900" />
                        <span className="font-bold">Tapis Daerah:</span>
                        <select
                          value={filterStesenDaerah}
                          onChange={(e) => setFilterStesenDaerah(e.target.value)}
                          className="font-bold text-blue-900 outline-none bg-transparent"
                        >
                          <option value="Semua">Semua Daerah</option>
                          {[...new Set(stesenList.map(s => s.daerah))].sort().map(d => (
                            <option key={d} value={d}>{d}</option>
                          ))}
                        </select>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                      {stesenList
                        .filter(s => filterStesenDaerah === 'Semua' ? true : s.daerah === filterStesenDaerah)
                        .filter(s => {
                          const isMini = s.nama.toLowerCase().includes('mini');
                          return lokasiTab === 'mini' ? isMini : !isMini;
                        })
                        .map((s, i) => {
                          const isMini = s.nama.toLowerCase().includes('mini');
                          return (
                            <div key={i} className="bg-white border border-gray-200 rounded-xl p-4 flex gap-4 shadow-sm relative overflow-hidden">
                              <div className={`absolute top-0 right-0 px-2.5 py-0.5 rounded-bl-lg text-[9px] font-black text-white ${isMini ? 'bg-orange-500' : 'bg-teal-600'}`}>
                                {isMini ? 'MINI STESEN (PRMS)' : 'STESEN (PRS)'}
                              </div>
                              <div className="w-1/3 bg-gray-100 rounded-lg overflow-hidden shrink-0 border border-gray-200 hidden sm:block mt-3">
                                <iframe 
                                  width="100%" height="100%" frameBorder="0" 
                                  src={`https://maps.google.com/maps?q=${encodeURIComponent(s.nama + ' ' + s.alamat)}&t=&z=14&ie=UTF8&iwloc=&output=embed`}
                                  className="w-full h-full min-h-[110px]"
                                ></iframe>
                              </div>
                              <div className="w-full sm:w-2/3 flex flex-col justify-center mt-3 text-xs">
                                <span className="font-extrabold text-[10px] text-gray-500 mb-1">{s.daerah}</span>
                                <h4 className="font-bold text-gray-900 text-sm mb-1">{s.nama}</h4>
                                <p className="text-gray-600 mb-2">{s.alamat}</p>
                                <span className="text-teal-800 font-semibold bg-teal-50 px-2 py-1 rounded self-start">
                                  Tel: {s.tel}
                                </span>
                              </div>
                            </div>
                          );
                      })}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* 5. DASHBOARD PENTADBIR */}
            {currentPage === 'admin' && (
              !isAdminLoggedIn ? (
                <div className="flex justify-center items-center min-h-[50vh]">
                  <div className="bg-white p-8 rounded-2xl shadow-xl border border-gray-200 max-w-sm w-full">
                    <div className="text-center mb-6">
                      <div className="inline-flex p-3 bg-blue-50 text-blue-900 rounded-full mb-3">
                        <Icon name="log-in" className="w-6 h-6" />
                      </div>
                      <h2 className="text-xl font-bold text-gray-900">Log Masuk Dashboard</h2>
                      <p className="text-gray-500 text-xs mt-1">Sila masukkan ID Log Masuk dan Kata Laluan.</p>
                    </div>

                    <form onSubmit={handleLogin} className="space-y-4 text-xs">
                      <div>
                        <label className="block font-bold text-gray-700 mb-1">ID Log Masuk (Username)</label>
                        <input 
                          type="text" 
                          value={icInput}
                          onChange={(e) => setIcInput(e.target.value)}
                          className="w-full px-3 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-900 outline-none"
                          placeholder="Masukkan No. Kad Pengenalan"
                          required
                        />
                      </div>
                      <div>
                        <label className="block font-bold text-gray-700 mb-1">Kata Laluan (Password)</label>
                        <div className="relative">
                          <input 
                            type={showPassword ? "text" : "password"} 
                            value={passwordInput}
                            onChange={(e) => setPasswordInput(e.target.value)}
                            className="w-full pl-3 pr-10 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-900 outline-none"
                            placeholder="Kata laluan"
                            required
                          />
                          <button
                            type="button"
                            onClick={() => setShowPassword(!showPassword)}
                            className="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-blue-900"
                          >
                            <Icon name={showPassword ? "eye-off" : "eye"} className="w-4 h-4" />
                          </button>
                        </div>
                      </div>
                      {loginError && <p className="text-red-500 font-bold bg-red-50 p-2 rounded">{loginError}</p>}
                      <button 
                        type="submit" 
                        className="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-2.5 rounded-lg shadow-md transition-colors"
                      >
                        Log Masuk
                      </button>
                    </form>
                  </div>
                </div>
              ) : (
                <div className="space-y-6">
                  <div className="flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                    <div>
                      <h1 className="text-2xl font-black text-gray-900">Dashboard Pentadbir</h1>
                      <p className="text-gray-500 text-xs">Akses pengurusan profil staf dan sistem dalaman.</p>
                    </div>
                    <button 
                      onClick={() => setIsAdminLoggedIn(false)}
                      className="px-4 py-2 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg text-xs font-bold flex items-center border border-red-200"
                    >
                      <Icon name="log-out" className="w-3.5 h-3.5 mr-1" /> Log Keluar
                    </button>
                  </div>

                  <DashboardHR />
                </div>
              )
            )}
          </main>

          {/* FOOTER */}
          <footer className="bg-gray-900 text-gray-300 py-10 border-t-4 border-yellow-500 text-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
                <div>
                  <div className="flex items-center space-x-3 mb-4">
                    <RisdaDriveLogo className="h-8 w-auto" showGlow={true} isSecond={false} />
                    <RisdaDriveLogo className="h-7 w-auto" showGlow={false} isSecond={true} />
                    <span className="font-extrabold text-sm text-white pl-2 border-l border-gray-700">RISDA PAHANG</span>
                  </div>
                  <p className="text-gray-400 leading-relaxed">
                    Pihak Berkuasa Kemajuan Pekebun Kecil Perusahaan Getah Negeri Pahang.
                  </p>
                </div>
                <div>
                  <h4 className="font-bold text-white text-sm mb-3">Pautan Pantas</h4>
                  <ul className="space-y-2">
                    <li><button onClick={() => navigateTo('home')} className="hover:text-yellow-400">Laman Utama</button></li>
                    <li><button onClick={() => navigateTo('profil')} className="hover:text-yellow-400">MTR 2030</button></li>
                    <li><button onClick={() => navigateTo('direktori')} className="hover:text-yellow-400">Direktori Pegawai</button></li>
                    <li><button onClick={() => navigateTo('lokasi')} className="hover:text-yellow-400">Lokasi PT</button></li>
                  </ul>
                </div>
                <div>
                  <h4 className="font-bold text-white text-sm mb-3">Hubungi Kami</h4>
                  <p className="text-gray-400 leading-relaxed">
                    Tingkat 1, Blok A, Bangunan RISDA, Lot 7876, Jalan Haji Junid, 25200 Kuantan, Pahang.<br/>
                    Tel: 09-5141911 / 09-5141912<br/>
                    Emel: pahang@risda.gov.my
                  </p>
                </div>
              </div>
              <div className="border-t border-gray-800 pt-6 text-center text-gray-500">
                &copy; {new Date().getFullYear()} Pentadbiran RISDA Pahang. Hak Cipta Terpelihara.
              </div>
            </div>
          </footer>
        </div>
      );
    }

    // Render ke DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
