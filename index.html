    const parseCSV = (str) => {
      const arr = [];
      let quote = false;
      let row = 0, col = 0;
      for (let c = 0; c < str.length; c++) {
        let cc = str[c], nc = str[c + 1];
        arr[row] = arr[row] || [];
        arr[row][col] = arr[row][col] || '';
        if (cc === '"' && quote && nc === '"') { arr[row][col] += cc; ++c; continue; }
        if (cc === '"') { quote = !quote; continue; }
        if (cc === ',' && !quote) { ++col; continue; }
        if (cc === '\r' && nc === '\n' && !quote) { ++row; col = 0; ++c; continue; }
        if (cc === '\n' && !quote) { ++row; col = 0; continue; }
        if (cc === '\r' && !quote) { ++row; col = 0; continue; }
        arr[row][col] += cc;
      }
      return arr;
    };

                          <select 
                            value={filterStesenDaerah} 
                            onChange={(e) => setFilterStesenDaerah(e.target.value)}
                            className="text-xs font-bold text-blue-900 bg-transparent outline-none cursor-pointer"
                          >
                            <option value="Semua">Semua Daerah</option>
                            {availableDaerahList.map(d => (
                              <option key={d} value={d}>{d}</option>
                            ))}
                          </select>
                        </div>
                      </div>

                      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        {currentCategoryStations
                          .filter(s => filterStesenDaerah === 'Semua' ? true : s.daerah === filterStesenDaerah)
                          .map((s, idx) => (
                            <div key={idx} className="bg-white border rounded-xl p-4 flex gap-4 shadow-sm relative overflow-hidden">
                              <div className="w-1/3 bg-gray-100 rounded-lg overflow-hidden border hidden sm:block">
                                <iframe 
                                  width="100%" height="100%" frameBorder="0" 
                                  src={`https://maps.google.com/maps?q=${encodeURIComponent(s.nama + ' ' + s.alamat)}&t=&z=14&ie=UTF8&iwloc=&output=embed`}
                                  title={s.nama}
                                ></iframe>
                              </div>
                              <div className="w-full sm:w-2/3">
                                <span className={`text-[10px] font-bold px-2 py-0.5 rounded uppercase mb-2 inline-block ${lokasiTab === 'mini' ? 'bg-orange-100 text-orange-800' : 'bg-teal-100 text-teal-800'}`}>{s.daerah}</span>
                                <h4 className="font-bold text-gray-900 text-sm mb-1">{s.nama}</h4>
                                <p className="text-xs text-gray-600 mb-3">{s.alamat}</p>
                                <span className={`text-xs font-semibold px-2 py-1 rounded ${lokasiTab === 'mini' ? 'bg-orange-50 text-orange-800' : 'bg-teal-50 text-teal-800'}`}>Tel: {s.tel}</span>
                              </div>
                            </div>
                          ))}
                      </div>
                    </div>
                  );
                })()}
              </div>
            )}

            {/* 5. MODUL DASHBOARD / LOG MASUK */}
            {currentPage === 'admin' && (
              <div>
                {!isAdminLoggedIn ? (
                  <div className="flex justify-center items-center min-h-[55vh]">
                    <div className="bg-white p-8 rounded-2xl shadow-lg border border-gray-200 max-w-md w-full">
                      <div className="text-center mb-8">
                        <div className="inline-flex p-4 bg-blue-50 text-blue-900 rounded-full mb-3">
                          <IconLogIn className="w-8 h-8" />
                        </div>
                        <h2 className="text-2xl font-black text-gray-900">Log Masuk Dashboard</h2>
                        <p className="text-gray-500 text-sm mt-1">Masukkan No. Kad Pengenalan dan Kata Laluan rasmi.</p>
                      </div>

                      <form onSubmit={handleLogin} className="space-y-5">
                        <div>
                          <label className="block text-sm font-semibold text-gray-700 mb-1">ID Pengguna (No. KP)</label>
                          <input 
                            type="text" 
                            value={icInput}
                            onChange={(e) => setIcInput(e.target.value)}
                            className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-900 outline-none"
                            placeholder="No. KP tanpa (-)"
                            required
                          />
                        </div>
                        <div>
                          <label className="block text-sm font-semibold text-gray-700 mb-1">Kata Laluan</label>
                          <div className="relative">
                            <input 
                              type={showPassword ? "text" : "password"} 
                              value={passwordInput}
                              onChange={(e) => setPasswordInput(e.target.value)}
                              className="w-full pl-4 pr-12 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-900 outline-none"
                              placeholder="Masukkan kata laluan..."
                              required
                            />
                            <button
                              type="button"
                              onClick={() => setShowPassword(!showPassword)}
                              className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-blue-900"
                            >
                              {showPassword ? <IconEyeOff className="w-5 h-5 text-blue-900" /> : <IconEye className="w-5 h-5" />}
                            </button>
                          </div>
                        </div>

                        {loginError && <p className="text-red-600 text-xs font-semibold bg-red-50 p-3 rounded-lg border border-red-200">{loginError}</p>}

                        <button 
                          type="submit" 
                          className="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-3.5 px-4 rounded-lg shadow-md transition-colors"
                        >
                          Log Masuk Dashboard
                        </button>
                      </form>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-6">
                    <div className="flex justify-between items-center bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                      <div>
                        <h1 className="text-2xl font-black text-gray-900">Dashboard Pentadbir</h1>
                        <p className="text-gray-500 text-sm">Sistem Kawalan Dalaman RISDA Negeri Pahang</p>
                      </div>
                      <button 
                        onClick={handleLogout}
                        className="flex items-center px-4 py-2 bg-red-50 hover:bg-red-100 text-red-600 font-bold rounded-lg border border-red-100 text-sm"
                      >
                        <IconLogOut className="w-4 h-4 mr-2" /> Log Keluar
                      </button>
                    </div>

                    <div className="flex space-x-2 bg-white p-2 rounded-xl border border-gray-200">
                      {['utama', 'pentadbiran', 'kewangan', 'kejuruteraan'].map((tab) => (
                        <button
                          key={tab}
                          onClick={() => setAdminTab(tab)}
                          className={`px-6 py-2.5 rounded-lg font-bold capitalize text-sm ${
                            adminTab === tab ? 'bg-blue-900 text-yellow-400 shadow-md' : 'text-gray-600 hover:bg-gray-50'
                          }`}
                        >
                          {tab}
                        </button>
                      ))}
                    </div>

                    {adminTab === 'utama' && <DashboardHR />}
                    {adminTab === 'pentadbiran' && (
                      <div className="p-8 bg-white rounded-xl border text-center text-gray-500">
                        Modul Rekod Pentadbiran & Pekeliling Dalaman Sedang Beroperasi.
                      </div>
                    )}
                    {adminTab === 'kewangan' && (
                      <div className="p-8 bg-white rounded-xl border text-center text-gray-500">
                        Modul Pengurusan Belanjawan & Perolehan.
                      </div>
                    )}
                    {adminTab === 'kejuruteraan' && (
                      <div className="p-8 bg-white rounded-xl border text-center text-gray-500">
                        Modul Penyelenggaraan Aset & Infrastruktur Bangunan.
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}
          </main>

          {/* FOOTER */}
          <footer className="bg-gray-900 text-gray-300 py-10 border-t-4 border-yellow-500 text-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
                <div>
                  {/* KIRI VIEWER: Logo Sekunder | KANAN VIEWER: Logo Emas Rasmi */}
                  <div className="flex items-center space-x-3 mb-4">
                    <RisdaDriveLogo className="h-7 w-auto" showGlow={false} isSecond={true} />
                    <RisdaDriveLogo className="h-8 w-auto" showGlow={true} isSecond={false} />
                    <span className="font-extrabold text-sm text-white pl-2 border-l border-gray-700">RISDA PAHANG</span>
                  </div>
                  <p className="text-gray-400 leading-relaxed">
                    Pihak Berkuasa Kemajuan Pekebun Kecil Perusahaan Getah Negeri Pahang.
                  </p>
                </div>
                <div>
                  <h4 className="font-bold text-white text-sm mb-3">Pautan Pintas</h4>
                  <ul className="space-y-1.5 text-gray-400">
                    <li><button onClick={() => navigateTo('home')} className="hover:text-yellow-400">Laman Utama</button></li>
                    <li><button onClick={() => navigateTo('profil')} className="hover:text-yellow-400">MTR 2026-2030</button></li>
                    <li><button onClick={() => navigateTo('lokasi')} className="hover:text-yellow-400">Lokasi Pusat Tanggungjawab</button></li>
                  </ul>
                </div>
                <div>
                  <h4 className="font-bold text-white text-sm mb-3">Hubungi Kami</h4>
                  <p className="text-gray-400 leading-relaxed">
                    Tingkat 1, Blok A, Bangunan RISDA, Lot 7876, Jalan Haji Junid, 25200 Kuantan, Pahang.<br/>
                    Tel: 09-5141911 / 09-5141912<br/>
                    Emel: pahang@risda.gov.my
                  </p>
                </div>
              </div>
              <div className="border-t border-gray-800 pt-6 text-center text-gray-500">
                &copy; {new Date().getFullYear()} Pentadbiran RISDA Pahang. Hak Cipta Terpelihara.
              </div>
            </div>
          </footer>
        </div>
      );
    }

    // Render ke DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
