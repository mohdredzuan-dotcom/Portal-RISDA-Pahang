<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Rasmi Pentadbiran RISDA Negeri Pahang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "lucide-react": "https://esm.sh/lucide-react@0.400.0",
          "firebase/app": "https://esm.sh/firebase@10.12.0/app",
          "firebase/auth": "https://esm.sh/firebase@10.12.0/auth",
          "firebase/firestore": "https://esm.sh/firebase@10.12.0/firestore"
        }
      }
    </script>
  </head>
  <body class="bg-gray-50">
    <div id="root"></div>
    <script type="module">
      import React from "react";
      import ReactDOM from "react-dom/client";

      async function bootPortal() {
        const rootEl = document.getElementById("root");
        try {
          const res = await fetch(`./App.jsx?v=${Date.now()}`);
          if (!res.ok) throw new Error(`Gagal memuatkan App.jsx (HTTP ${res.status})`);
          const rawCode = await res.text();
          const compiled = Babel.transform(rawCode, {
            presets: ["react"],
            filename: "App.jsx"
          }).code;

          const blob = new Blob([compiled], { type: "application/javascript" });
          const blobUrl = URL.createObjectURL(blob);
          const mod = await import(blobUrl);
          URL.revokeObjectURL(blobUrl);

          const AppComponent = mod.default;
          ReactDOM.createRoot(rootEl).render(
            React.createElement(React.StrictMode, null, React.createElement(AppComponent))
          );
        } catch (err) {
          console.error(err);
          rootEl.innerHTML = `<div style="padding:24px;font-family:sans-serif;color:#991b1b;background:#fef2f2;margin:24px;border-radius:12px;border:1px solid #fecaca;"><strong>Ralat Memuatkan Portal:</strong> ${err.message}</div>`;
        }
      }

      bootPortal();
    </script>
  </body>
</html>
